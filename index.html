<!DOCTYPE html>
<html lang="en">
<head>
  <title>CyberStorm</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="gameCanvas" width="600" height="400"></canvas>

<!---- LOADING SCREEN ---->
  <div id="loadingScreen">
    <h2> Loading CyberStorm </h2>
    <p id="loadingProgress">0%</p>
  </div>
  
  <!---- MAIN MENU SCREEN ---->
  <div id="menu">
    <h2> CYBERSTORM </h2>
    <button id="startBtn">Start Game</button>
  </div>

  <!----- GAME OVER SCREEN ---->
  <div id="gameOverScreen">
    <h2>GAME OVER</h2>
    <p id="finalScore"></p>
    <button id="restartBtn">Restart</button>
  </div>

  <!------- AUDIO ------------>
  <audio id="bgMusic" src="assets/sounds/bgMusic.mp3" loop></audio>
  <audio id="shootSound" src="assets/sounds/shoot.mp3"></audio>
  <audio id="explosionSound" src="assets/sounds/explosion.mp3"></audio>

  <!------------- JS MODULES ----------->
  <script type="module" src="js/main.js"></script>
</body>
</html>

    
  
</body>
